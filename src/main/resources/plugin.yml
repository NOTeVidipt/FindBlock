name: FindBlock
version: 1.4.0
main: com.example.findblock.FindBlockPlugin
api-version: '1.21'
description: Find blocks nearby or across saved chunks with resumable searches, history, teleport and configurable performance limits.
author: FindBlock Contributors
commands:
  findblock:
    description: Search for blocks, resume searches, view history, or teleport to a result.
    usage: /findblock <block[,block...]> [radius] | /findblock world <block[,block...]> | /findblock resume | /findblock cancel | /findblock history | /findblock tp | /findblock admin reload
    permission: findblock.use
permissions:
  findblock.use:
    description: Allows nearby FindBlock searches and basic commands.
    default: true
  findblock.world:
    description: Allows expensive full-world searches.
    default: op
  findblock.tp:
    description: Allows teleporting to the latest FindBlock result.
    default: op
  findblock.admin:
    description: Allows reloading config and managing FindBlock searches.
    default: op
